[project]
name = "Rengin"
version = "0.0.1"
description = "A game made with pygame-ce"
readme = "README.md"
authors = [
    { name = "LuMarquesIlva", email = "luismarques0504@proton.me" }
]
requires-python = ">=3.14"
dependencies = ["pygame-ce>=2.5.8"]

[project.scripts]
rengin = "rengin:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pygame-ce>=2.5.8",
]
